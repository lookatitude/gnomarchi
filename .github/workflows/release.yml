name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.0.1-beta.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${VERSION}" > VERSION

      - name: Build source archive
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh

      - name: Verify archive sha256
        run: |
          set -euo pipefail
          cd dist
          archive="$(echo gnomarchi-*.tar.gz | awk '{print $1}')"
          sumfile="${archive}.sha256"
          test -f "${archive}"
          test -f "${sumfile}"
          echo "Archive: ${archive}"
          cat "${sumfile}"
          sha256sum -c "${sumfile}"
          echo "Verified SHA256 matches ${sumfile}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: gnomarchi ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            dist/gnomarchi-*.tar.gz
            dist/gnomarchi-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
