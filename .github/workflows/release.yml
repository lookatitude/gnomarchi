name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.0.1-beta.4)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${VERSION}" > VERSION

      - name: Build source archive
        run: |
          chmod +x scripts/build-release.sh scripts/build-iso.sh
          ./scripts/build-release.sh

      - name: Write release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## gnomarchi ${VERSION}"
            echo
            echo "Beta tag (${VERSION}), published as the Latest release."
            echo
            echo "### Assets"
            echo "- gnomarchi-${VERSION}.tar.gz — source / overlay tree"
            echo "- gnomarchi-${VERSION}-x86_64.iso — guided live ISO (archiso)"
            echo "- matching .sha256 sidecars"
            echo
            echo "### Install"
            echo "Overlay: extract the source tarball and run ./install/overlay.sh."
            echo "USB: write the .iso with dd / Ventoy / balenaEtcher, boot, then /root/gnomarchi-install.sh."
            echo "AUR: packaging/aur/gnomarchi (makepkg -si)."
          } > dist/RELEASE_NOTES.md

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ steps.ver.outputs.version }}
          path: |
            dist/gnomarchi-${{ steps.ver.outputs.version }}.tar.gz
            dist/gnomarchi-${{ steps.ver.outputs.version }}.tar.gz.sha256
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  iso:
    runs-on: ubuntu-latest
    needs: source
    timeout-minutes: 180
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git rsync sudo

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x iso/build.sh scripts/build-iso.sh
          ./iso/build.sh
          ISO="$(find iso/out -maxdepth 1 -type f -name '*.iso' | head -n 1)"
          test -n "${ISO}" && test -f "${ISO}"
          mkdir -p dist
          DEST="dist/gnomarchi-${VERSION}-x86_64.iso"
          mv "${ISO}" "${DEST}"
          (
            cd dist
            sha256sum "gnomarchi-${VERSION}-x86_64.iso" > "gnomarchi-${VERSION}-x86_64.iso.sha256"
          )
          ls -lh "dist/gnomarchi-${VERSION}-x86_64.iso"*

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ needs.source.outputs.version }}
          path: |
            dist/gnomarchi-${{ needs.source.outputs.version }}-x86_64.iso
            dist/gnomarchi-${{ needs.source.outputs.version }}-x86_64.iso.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    runs-on: ubuntu-latest
    needs: [source, iso]
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ needs.source.outputs.version }}
          path: dist

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: iso-${{ needs.source.outputs.version }}
          path: dist

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.source.outputs.tag }}
          name: gnomarchi ${{ needs.source.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/gnomarchi-${{ needs.source.outputs.version }}.tar.gz
            dist/gnomarchi-${{ needs.source.outputs.version }}.tar.gz.sha256
            dist/gnomarchi-${{ needs.source.outputs.version }}-x86_64.iso
            dist/gnomarchi-${{ needs.source.outputs.version }}-x86_64.iso.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
